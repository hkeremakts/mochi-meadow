# The meadow's tuning: how the weather, Mochi and the encounters behave.
#
# These are the defaults.  To change something, don't edit this file: put
# just the values you want in a settings.toml of your own (next to the
# journal, ~/Library/Application Support/Meadow/settings.toml, or pass
# --settings PATH).  Anything you leave out keeps the value here.
#
# Times are in real seconds unless a name says otherwise.
#
# Values that vary are written as a shape of chance (see habitat/chance.py):
#   { typical = 20, spread = 0.6 }    log-normal: usually about 20, now and then much more
#   { mean = 7.5, sd = 0.25 }         normal: evenly either side of 7.5
#   { mean_wait = 120 }               exponential: a wait for something to turn up
#   { scale = 40, shape = 2.2 }       Weibull: how long until she's had enough
#   { a = 9, b = 1.2 }                beta: a proportion between 0 and 1
#   { poisson = 4.5 }                 Poisson: how many
#   { pareto = 2.2, scale = 5 }       Pareto: a rare extreme (always give a max)
#   { mix = [ { weight = 0.7, ... }, ... ] }   one of several kinds
#   [4, 10]                           uniform between 4 and 10
# Each may have min and max.  "spread" is in log units: 0.3 steady, 0.7 wild.

# Each day has a character of its own, decided at dawn (the same however
# often the meadow restarts that day).
[day]
volatility = { typical = 1.0, spread = 0.4, min = 0.4, max = 2.5 }   # how changeable the weather is
busyness = { typical = 1.0, spread = 0.3, min = 0.5, max = 2.0 }     # how lively the wildlife is
energy = { mean = 1.0, sd = 0.08, min = 0.8, max = 1.2 }             # Mochi's get-up-and-go
spread = { typical = 1.0, spread = 0.25, min = 0.6, max = 1.6 }      # how wild the day's chances are

[screen]
fps = 60                  # in a window
saver_fps = 30            # as a screensaver
calm_fps = 15             # as a screensaver, when nothing on screen moves fast
art_rows = 280            # roughly how many art pixels fit the screen's height
min_zoom = 2
max_zoom = 8
lite_zoom = 2             # lite mode draws at this zoom and lets the GPU scale the rest
window = [1280, 800]
time_speeds = [1, 60, 600]        # what T cycles through
screensaver_grace = 1.5           # seconds before input ends a screensaver
save_every = 300                  # seconds between saves of the session to the journal

[weather]
blend = { typical = 45, spread = 0.5, min = 10, max = 180 }   # easing into the next weather: a sudden shower or a slow build
quick_blend = 3           # ...and into one chosen with W
cloud_steadiness = 25     # how closely each spell's cloud cover keeps to its kind's (beta)
wind_scatter = 3.0        # how closely the wind keeps to the day's prevailing direction (von Mises)
# Gusts you can see: pale bands race over the grass where a gust flattens it and the blades catch the light.
sheen = { above = 0.5, rate = 0.9, brightness = 38, most = 5 }   # gust strength it needs, bands a second at full gust, how bright, at most at once

# How long each kind of weather lasts, in minutes (divided by the day's volatility).
[weather.hold_minutes]
clear = { typical = 25, spread = 0.7, min = 5, max = 240 }
cloudy = { typical = 15, spread = 0.6, min = 4, max = 120 }
windy = { typical = 10, spread = 0.6, min = 3, max = 60 }
drizzle = { typical = 12, spread = 0.6, min = 3, max = 90 }
# A passing shower, a proper soaking, or (rarely) rain all day.
rain = { mix = [ { weight = 0.55, typical = 7, spread = 0.45 }, { weight = 0.4, typical = 30, spread = 0.5 }, { weight = 0.05, typical = 120, spread = 0.4 } ], min = 2, max = 300 }

# Inside a spell, rain and wind wander and return (Ornstein-Uhlenbeck).
[weather.wander]
rain_sd = 0.22            # how far the rain strays from its usual heaviness (fraction)
rain_seconds = 90         # how quickly it changes
wind_sd = 0.25
wind_seconds = 240

# What each kind of weather looks like: cloud cover, wind, rain (0..1).
[weather.states]
clear = { cloud = 0.15, wind = 0.18, rain = 0.0 }
cloudy = { cloud = 0.62, wind = 0.32, rain = 0.0 }
windy = { cloud = 0.4, wind = 0.9, rain = 0.0 }
drizzle = { cloud = 0.82, wind = 0.3, rain = 0.32 }
rain = { cloud = 1.0, wind = 0.5, rain = 0.85 }

# What tends to follow what (relative weights).
[weather.next]
clear = { clear = 5, cloudy = 3, windy = 2 }
cloudy = { clear = 4, cloudy = 2, drizzle = 2, windy = 1, rain = 1 }
windy = { clear = 4, cloudy = 4, windy = 1 }
drizzle = { cloudy = 4, rain = 3, drizzle = 2, clear = 1 }
rain = { drizzle = 5, cloudy = 4, rain = 1 }

# Seasons tilt those weights: dry summers, wet and windy autumns.
[weather.season_bias]
summer = { clear = 1.6, cloudy = 0.8, windy = 0.7, drizzle = 0.6, rain = 0.7 }
spring = { clear = 1.0, cloudy = 1.0, windy = 1.0, drizzle = 1.3, rain = 1.0 }
autumn = { clear = 0.8, cloudy = 1.2, windy = 1.5, drizzle = 1.2, rain = 1.2 }
winter = { clear = 0.8, cloudy = 1.4, windy = 1.0, drizzle = 1.0, rain = 1.0 }

[cold]
snow_below = 1.0          # Celsius: colder than this, rain falls as snow
snow_settles = 900        # seconds of heavy snow to cover the ground
snow_melts = 2400         # seconds to melt at 1.5 C above freezing (faster when warmer)
sun_melt = 0.4            # how much sunshine adds to melting
rain_melt = 3.0           # rain melts snow this many times faster
frost_below = 1.5         # Celsius, on a clear, dark night
frost_forms = 1800        # seconds to a full frost
frost_lifts = 1800        # seconds to lift at 1 C in full sun (faster when warmer)

# Paw prints and worn paths.
[marks]
muddy_steps = 12          # prints she leaves after stepping in a puddle
mud_dries_seconds = 420   # a muddy print dries away (faster in sun, washed by rain)
snow_fills_seconds = 150  # falling snow fills a print in (heavy snow; slower when light)
snow_print_seconds = 10800   # prints in lying snow soften (faster as it thaws)
wear_step = 0.05          # how much one footfall wears the grass
wear_shows = 0.42         # wear shows as a path above this (her everyday routes, not every wander)
grass_recovers_hours = 30 # worn grass grows back with this time constant

# The tree's shadow follows the real sun; Mochi uses it.
[shade]
darkness = 1.0            # how deep the tree's shade is (0 = no shadow)
moon_shadow = 0.6         # a bright moon casts a faint one too
hot_above = 23.0          # Celsius: warmer than this, she rests in the shade
cold_below = 13.0         # colder than this, she looks for a patch of sun
seek_chance = 0.85        # how often she bothers when choosing where to rest
# Seconds lying in the wrong light (the shade moved off her) before she gets up and moves.
restless_after = { typical = 150, spread = 0.5, min = 40, max = 600 }

[meals]
times = [7.5, 18.0]       # the usual hours the bowl is filled...
lateness = { mean = 0.0, sd = 0.25, min = -0.75, max = 0.75 }   # ...give or take this many hours, each day
refill = { a = 9, b = 1.2, min = 0.6, max = 1.0 }               # how full it gets
empty_bowl_patience = { typical = 420, spread = 0.35, min = 180, max = 1200 }   # an empty bowl is topped up after this long anyway

[wildlife]
# Visits that come in clusters (Hawkes): a background wait in seconds, and
# how much each visit makes another likelier (per second, fading over memory).
pigeons = { mean_wait = 140, excite = 0.004, memory = 600 }
sparrows = { mean_wait = 105, excite = 0.006, memory = 480 }
overhead = { mean_wait = 50, excite = 0.01, memory = 240 }   # birds flying over (only their shadows)
pigeon_flock = { poisson = 1.8, min = 1, max = 6 }
# Usually a handful of sparrows; once in a long while a great chattering flock.
sparrow_flock = { mix = [ { weight = 0.92, poisson = 4.2 }, { weight = 0.08, pareto = 2.2, scale = 6 } ], min = 2, max = 16 }
spawn_wait = { mean_wait = 8, min = 2, max = 40 }   # between arrivals of one kind of creature
mouse_wait = { mean_wait = 40, min = 10, max = 180 }
day_mouse_first = { mean_wait = 200, min = 30, max = 900 }   # the first check for a daytime mouse
day_mouse_check = { mean_wait = 300, min = 60, max = 1200 }
day_mouse_chance = 0.3    # odds that a mouse is about by day
hedgehog_night_chance = 0.7

# When creatures are about, as smooth peaks on the clock (standard hours:
# sunrise is about 6.2 and sunset 19.4 whatever the season).
[wildlife.hours]
fireflies = { peak = 23.5, width = 2.2 }
mice = [ { peak = 22.0, width = 3.0 }, { peak = 5.6, width = 1.2, height = 0.8 } ]
frogs_evening = { peak = 21.5, width = 3.0 }
hedgehog = { peak = 1.0, width = 2.4 }

[mochi]
pace = { mean = 1.0, sd = 0.05, min = 0.85, max = 1.15 }   # her own speed, decided once
walk_speed = 26.0         # art pixels per second
stalk_speed = 11.0
trot_speed = 48.0
run_speed = 96.0
favourite_after = 3       # naps in one spot before it is her favourite
best_friends = 4          # good visits before the ginger cat naps beside her
fox_fear_distance = 170   # a timid cat hides when a fox is this close (art pixels)

cooldown_spread = 0.3     # cooldowns vary this much around their usual (log units)
# A catnap or a proper sleep, in minutes (she wakes once it's over and she's rested enough).
nap_minutes = { mix = [ { weight = 0.65, typical = 4, spread = 0.4 }, { weight = 0.35, typical = 16, spread = 0.4 } ], min = 1.5, max = 45 }
# How long until she's had enough (Weibull: the longer it goes on, the likelier she stops).
loaf_seconds = { scale = 40, shape = 2.2, min = 10, max = 150 }
sit_seconds = { scale = 16, shape = 2.0, min = 4, max = 60 }
pond_watch_seconds = { scale = 20, shape = 2.0, min = 6, max = 80 }
watch_seconds = { scale = 11, shape = 2.0, min = 4, max = 40 }
eat_seconds = { typical = 9, spread = 0.25, min = 5, max = 18 }
mood_wander = 0.08        # her mood drifts a little on its own (Ornstein-Uhlenbeck sd)
evening_zoomies_hours = [17.0, 21.5]   # dinner at dusk...
evening_zoomies_chance = 0.4           # ...and the odds of a mad dash after it (scaled by how playful she is)
dream_after = 90          # seconds asleep before she sleeps deeply enough to dream
dream_wait = { mean_wait = 70, min = 15, max = 400 }   # seconds between dreams (paws paddling, an ear twitching)


# Needs: seconds for each to go from empty to full (or full to empty).
[mochi.needs]
energy_awake = 720        # rested to sleepy, pottering about
energy_active = 300       # ...running and hunting
energy_sleep = 200        # a nap that restores her fully
hunger = 1500
thirst = 1100
groom = 420
play = 260

# How long before she does the same thing again (typical; see cooldown_spread).
[mochi.cooldowns]
loaf = 90
groom = 60
watch_pond = 150
wait_dinner = 3600
chatter = 120
tail_chase = 300
meow = 150
zoomies = 360
drizzle = 480
revisit = 1200
revisit_caption = 10800

# Body language: her tail and ears show her mood (moods run from -1 to 1).
[mochi.body_language]
happy_above = 0.5         # tail up, hooked at the tip, ears pricked
cross_below = -0.3        # ears back, tail lashing
settle = 0.1              # a mood has to fade this far past its edge before she lets it go

# Places she remembers (a mouse, the fox, a deer, a hedgehog, a gift) and goes back to check.
[mochi.places]
sight = 150               # art pixels: how far off she notices something
forget_hours = 60         # a memory fades to about a third in this long (gone in a fortnight)
first = { mouse = 1.0, fox = 1.0, deer = 1.0, hedgehog = 0.7, gift = 0.8 }   # how strong a new memory is
renew = 0.5               # added when the same thing turns up there again
cap = 2.0
nothing_there = 0.55      # a visit that finds nothing keeps this much of a memory
floor = 0.12              # weaker than this and it's forgotten
ripen_minutes = 40        # she doesn't go back straight away: the pull builds over about this long
weight = 0.25             # how strongly a remembered place competes with wandering (2.0), sitting (1.6)...
keep = 16                 # places remembered at most
caption_after_hours = 12  # a caption when she goes back to something at least this old

[mochi.rain]
shelter_above = 0.35      # rain heavier than this sends her for cover
drizzle_above = 0.08      # lighter than shelter_above but above this is a drizzle
roof_preference = 0.85    # odds she picks the tree over a bush
drizzle_chance = 0.0012   # odds per look-round (every 0.35 s) of a drizzle break
drizzle_stay = { typical = 35, spread = 0.4, min = 15, max = 90 }   # seconds she waits out a drizzle under the tree
venture_rate = 0.006      # per second: popping out into the rain (scaled by her character)
wet_shake = 6             # seconds of real rain on her fur before she needs a good shake

[events]
check = 4                 # seconds between rolls of the dice
caption_seconds = 9
overdue_boost = 1.5       # how fast the odds grow once a tier is overdue
cooldown_spread = 0.3     # cooldowns vary this much around their usual (log units)
omen_spread = 0.2         # omens vary this much (fraction)

# The mean wait between events of each tier, in minutes, while you watch.
[events.tiers]
common = 7
uncommon = 40
rare = 180
legendary = 1440

# How long before the same event may happen again, in minutes.
[events.cooldown_minutes]
"tail chase" = 20
"dandelion seeds" = 15
"a feather" = 20
"a crow" = 25
"a mouse peeking out" = 20
"pouncing on a shadow" = 30
"chasing a leaf" = 20
"a grasshopper" = 25
"moths" = 40
"puddles" = 120
"two butterflies dancing" = 30
"a dewy spider web" = 480
"morning mist" = 360
"a rainbow" = 120
"a whirlwind" = 40
"bats" = 180
"a gift" = 300
"a shooting star" = 60
"Mochi noticed you" = 240
"the ginger cat" = 300
"a fox" = 360
"a heron" = 360
"a duck and her ducklings" = 480
"the golden butterfly" = 720
"a deer at dawn" = 1440

# Events that belong to a time of day: smooth peaks on the clock (standard hours).
[events.hours]
"morning mist" = { peak = 6.0, width = 0.9 }
"bats" = { peak = 20.6, width = 0.8 }
"a fox" = [ { peak = 6.0, width = 1.1 }, { peak = 20.3, width = 1.3 } ]
"a deer at dawn" = { peak = 6.0, width = 0.8 }
"a dewy spider web" = { peak = 6.8, width = 1.0 }

# Seconds of hush (the birds go quiet) before a legendary event.
[events.omen_seconds]
"the golden butterfly" = 25
"a deer at dawn" = 30

[effects]
shooting_star = 0.75      # seconds for one streak
meteors = { mean_wait = 30, excite = 0.03, memory = 40 }   # a meteor shower's stars come in little bursts
mist_rise = { typical = 90, spread = 0.4, min = 30, max = 300 }    # seconds for dawn mist to thicken...
mist_lift = { typical = 150, spread = 0.4, min = 50, max = 500 }   # ...and to lift
mist_lasts_minutes = { typical = 20, spread = 0.35, min = 8, max = 60 }
rainbow_fade = 40
rainbow_lasts_minutes = { typical = 5, spread = 0.35, min = 2, max = 14 }
rainbow_after_rain = 240  # a rainbow may come this long after the rain stops
puddles_last_minutes = { typical = 12, spread = 0.4, min = 4, max = 40 }
fireworks_minutes = { mean = 15, sd = 3, min = 8, max = 25 }
butterfly_dance = { typical = 9, spread = 0.25, min = 5, max = 18 }

# How many.
[effects.counts]
ducklings = { poisson = 4.5, min = 2, max = 9 }
bats = { poisson = 1.8, min = 1, max = 5 }
moths = { poisson = 2.0, min = 1, max = 5 }
dandelion_seeds = { poisson = 11, min = 5, max = 22 }
whirl_leaves = { poisson = 13, min = 7, max = 22 }
heron_rounds = { poisson = 4, min = 2, max = 8 }
deer_bouts = { poisson = 3, min = 1, max = 6 }

# How long, for visitors (Weibull: until they've had enough).
[effects.stays]
ginger_sits = { scale = 38, shape = 2.2, min = 15, max = 100 }
deer_grazes = { scale = 12, shape = 2.0, min = 4, max = 30 }
heron_hunts = { scale = 13, shape = 2.0, min = 4, max = 35 }
